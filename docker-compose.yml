services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reelvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelvault}
      POSTGRES_DB: ${POSTGRES_DB:-reelvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reelvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: reelvault-backend
    command: ["api"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
      - ./secrets:/secrets:ro

  worker:
    image: reelvault-backend
    command: ["worker"]
    env_file: .env
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/data
      - ./secrets:/secrets:ro

  frontend:
    build: ./frontend
    image: reelvault-frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  appdata:
